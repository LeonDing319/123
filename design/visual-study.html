<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反锁的书房 · 视觉系统小样</title>
<style>
  :root {
    --background:#101615; --surface:#161e1b; --line:#38483e;
    --text:#e6e9dc; --muted:#a4b3a6; --signal:#a8dbb4; --evidence:#ecd293;
    --fault:#ffa7a0; --grid:4px; --scanline:.14;
    --mono:Consolas,"Microsoft YaHei",monospace;
    color-scheme:dark;
  }
  * { box-sizing:border-box }
  body { margin:0; padding:32px; background:var(--background); color:var(--text); font:16px/1.65 "Microsoft YaHei",system-ui,sans-serif }
  main { max-width:1200px; margin:auto }
  button { min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:0; background:var(--surface); color:var(--text); font:inherit; cursor:pointer }
  button:hover { border-color:var(--signal) }
  button:focus-visible { outline:2px solid var(--signal); outline-offset:3px }
  [aria-pressed="true"] { color:var(--signal); border-color:var(--signal) }
  [hidden] { display:none !important }
  .mast,.panel-head,.feed-label,.scene-actions,.bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap }
  .mast { padding-bottom:20px; border-bottom:1px solid var(--line) }
  .id { display:flex; align-items:center; gap:12px; color:var(--signal) }
  .id::before { content:""; width:12px; height:12px; border:2px solid currentColor; box-shadow:inset 0 0 0 2px var(--background); background:currentColor }
  .meta { font:14px/1.5 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums }
  .chapter { margin:24px 0 20px }
  h1 { font-size:clamp(28px,4vw,40px); letter-spacing:.08em; margin:2px 0 0; line-height:1.2 }
  .layout { display:grid; grid-template-columns:minmax(0, 1fr) 320px; gap:16px; align-items:start }
  .panel { border:1px solid var(--line); background:var(--surface); min-width:0 }
  .panel-head,.bar { padding:8px 16px; min-height:44px }
  .panel-head { border-bottom:1px solid var(--line) }
  h2 { margin:0; font-size:15px; font-weight:600 }
  .feed { position:relative; background:#171f1b }
  canvas { display:block; width:100%; aspect-ratio:240 / 104; image-rendering:pixelated }
  .crt::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(180deg,transparent 0 2px,#000 2px 3px); opacity:var(--scanline) }
  .feed-label { position:absolute; z-index:1; inset:auto 12px 12px; pointer-events:none }
  .feed-label span { color:var(--text); padding:2px 8px; background:#101615 }
  .story { padding:16px; border-top:1px solid var(--line) }
  .story p { margin:0 0 12px; max-width:44em; line-height:1.9 }
  .clue { color:var(--evidence); border-color:#a79159 }
  .clue-note { margin-top:12px; padding:8px 12px; border-left:2px solid var(--evidence); background:#24251d }
  .clue-note strong { color:var(--evidence) }
  .side { display:grid; gap:16px }
  .messages { list-style:none; margin:0; padding:0 16px }
  .messages li { padding:12px 0; border-bottom:1px solid var(--line) }
  .messages li:last-child { border:0 }
  .messages p { margin:4px 0 0 }
  .hypothesis { color:var(--signal) }
  .extra,.empty { padding:12px 16px; margin:0 }
  .extra { border-top:1px solid var(--line); color:var(--muted) }
  .status { color:var(--signal) }
  @media (max-width:820px) { body { padding:16px } .layout { grid-template-columns:1fr } }
</style>
<main>
  <header class="mast">
    <div class="id">叙事档案终端</div>
    <button id="crt" type="button" aria-pressed="true" aria-controls="feed">CRT 材质<span id="crt-state"> · 开</span></button>
  </header>
  <div class="chapter">
    <div class="meta">开场样稿 / 走廊</div>
    <h1>反锁的书房</h1>
  </div>
  <div class="layout">
    <section class="panel" aria-labelledby="feed-title">
      <header class="panel-head"><h2 id="feed-title">走廊监视画面</h2><span class="meta">CAM 01</span></header>
      <div class="feed crt" id="feed">
        <canvas id="scene" width="240" height="104" role="img" aria-label="昏暗的走廊尽头有一扇门，门缝下透出暖光，门前地毯上有一段蓝线。"></canvas>
        <div class="feed-label meta"><span>回放</span><span>21:00:09</span></div>
      </div>
      <article class="story" aria-label="剧情记录">
        <p>林岑抬手敲门。走廊尽头的老钟刚响过九下，书房里却没人应声。她压了压门把手，听见锁舌抵住门框。门缝下有一线灯光，地毯上落着半截蓝线。</p>
        <div class="scene-actions">
          <button class="clue" id="inspect" type="button" aria-controls="clue-note" aria-expanded="false">查看线索 · 半截蓝线</button>
          <span class="meta">线索 01</span>
        </div>
        <div class="clue-note" id="clue-note" hidden><strong>记录摘录</strong>　蓝线位于书房门外的地毯上。</div>
      </article>
    </section>
    <aside class="side" aria-label="弹幕与证据">
      <section class="panel" aria-labelledby="chat-title">
        <header class="panel-head"><h2 id="chat-title">弹幕记录</h2><button id="pause" type="button" aria-pressed="false" aria-controls="extra">暂停弹幕</button></header>
        <ol class="messages">
          <li><span class="meta">21:00:03</span><p>听到了吗，钟响了九下。</p></li>
          <li><span class="meta">21:00:06</span><p>门缝下面有光。</p></li>
          <li><span class="meta">21:00:09 · <span class="hypothesis">AI 推测</span></span><p>蓝线也许是从门里的地毯扯下来的。</p></li>
        </ol>
        <p class="extra" id="extra" aria-live="off"></p>
        <div class="bar"><span class="meta status" id="stream-status" role="status">接收中</span></div>
      </section>
      <section class="panel" aria-labelledby="evidence-title">
        <header class="panel-head"><h2 id="evidence-title">已查看线索</h2><span class="meta" id="evidence-count" aria-live="polite">0 件</span></header>
        <p class="empty" id="evidence-item">暂无线索。</p>
      </section>
    </aside>
  </div>
</main>
<script>
  const canvas = document.querySelector('#scene');
  const context = canvas.getContext('2d');

  function rect(color, x, y, width, height) {
    context.fillStyle = color;
    context.fillRect(x, y, width, height);
  }

  function polygon(color, points) {
    context.fillStyle = color;
    context.beginPath();
    const [[x, y], ...remaining] = points;
    context.moveTo(x, y);
    for (const [nextX, nextY] of remaining) context.lineTo(nextX, nextY);
    context.closePath();
    context.fill();
  }

  rect('#232f27', 0, 0, 240, 104);
  polygon('#1b231e', [[0,0],[240,0],[155,24],[90,24]]);
  polygon('#334337', [[0,0],[90,24],[90,75],[0,104]]);
  polygon('#293d32', [[240,0],[155,24],[155,75],[240,104]]);
  polygon('#30352a', [[0,104],[90,75],[155,75],[240,104]]);
  polygon('#50604c', [[0,73],[90,61],[90,63],[0,76]]);
  polygon('#425748', [[155,61],[240,73],[240,76],[155,63]]);
  polygon('#1c2c24', [[0,94],[90,71],[90,75],[0,104]]);
  polygon('#17261f', [[155,71],[240,94],[240,104],[155,75]]);
  rect('#3d4635', 90, 24, 65, 51);
  rect('#151d17', 105, 28, 34, 48);
  rect('#7a7351', 108, 30, 28, 46);
  rect('#3e4331', 110, 32, 24, 43);
  rect('#505441', 112, 36, 20, 15);
  rect('#32392c', 113, 37, 18, 13);
  rect('#505441', 112, 54, 20, 17);
  rect('#32392c', 113, 55, 18, 15);
  rect('#c2a46e', 128, 53, 4, 2);
  rect('#e4c18a', 109, 75, 26, 1);
  polygon('#736648', [[109,76],[135,76],[156,93],[88,93]]);
  polygon('#545641', [[103,83],[140,83],[177,104],[65,104]]);
  polygon('#69654a', [[106,84],[137,84],[168,103],[74,103]]);
  polygon('#444d3e', [[107,85],[136,85],[161,103],[81,103]]);
  rect('#84b4be', 119, 89, 6, 1);
  rect('#84b4be', 124, 88, 3, 1);
  polygon('#202e25', [[22,29],[47,32],[47,79],[22,86]]);
  polygon('#576352', [[26,33],[43,35],[43,58],[26,60]]);
  rect('#b5b28b', 29, 38, 11, 14);
  rect('#344034', 34, 40, 1, 6);
  rect('#344034', 34, 46, 4, 1);
  rect('#777453', 34, 66, 2, 8);
  let seed = 39;
  for (let index = 0; index < 3000; index += 1) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    const x = seed % 240;
    const y = (seed >>> 12) % 104;
    rect(index % 3 ? '#121a1529' : '#bec1a022', x, y, 1, 1);
  }

  const crt = document.querySelector('#crt');
  const feed = document.querySelector('#feed');
  crt.addEventListener('click', () => {
    const enabled = feed.classList.toggle('crt');
    crt.setAttribute('aria-pressed', enabled);
    document.querySelector('#crt-state').textContent = enabled ? ' · 开' : ' · 关';
  });

  const inspect = document.querySelector('#inspect');
  const note = document.querySelector('#clue-note');
  inspect.addEventListener('click', () => {
    note.hidden = !note.hidden;
    inspect.setAttribute('aria-expanded', !note.hidden);
    document.querySelector('#evidence-count').textContent = '1 件';
    document.querySelector('#evidence-item').textContent = '01 · 半截蓝线';
  });

  const pause = document.querySelector('#pause');
  const extra = document.querySelector('#extra');
  const sampleMessages = ['21:00:12 · 镜头里能看到门把手。', '21:00:15 · 走廊里没有看见其他人。', '21:00:18 · 画面到这里结束了。'];
  let messageIndex = 0;
  extra.textContent = sampleMessages[messageIndex];
  const timer = setInterval(() => {
    if (pause.getAttribute('aria-pressed') === 'true') return;
    messageIndex += 1;
    extra.textContent = sampleMessages[messageIndex];
    if (messageIndex === sampleMessages.length - 1) {
      clearInterval(timer);
      document.querySelector('#stream-status').textContent = '回放完毕';
      pause.disabled = true;
    }
  }, 6000);
  pause.addEventListener('click', () => {
    const paused = pause.getAttribute('aria-pressed') !== 'true';
    pause.setAttribute('aria-pressed', paused);
    document.querySelector('#stream-status').textContent = paused ? '已暂停' : '接收中';
  });
</script>
</html>
